[package]
name = "wsb"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
minijinja = { version = "2", features = ["loader", "urlencode"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
calamine = { version = "0.35", features = ["dates"] }
reqwest = { version = "0.13", features = ["form", "json", "query", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
humantime = "2"
sha2 = "0.11.0"
hex = "0.4.3"
futures = "0.3.32"
brotli = "8.0.2"
formualizer-workbook = { version = "0.6.0", features = ["calamine"] }
formualizer-common = "2.0.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
jsonwebtoken = "9.3.0"  # pinned: v10+/v11 require selecting a crypto provider feature and panic at runtime without one; keep 9.x until a provider feature is wired in

[dev-dependencies]
formualizer-workbook = { version = "0.6.0", features = ["calamine"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
