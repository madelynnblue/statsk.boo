{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<form class="search-row" action="/search" method="get">
  <input type="search" name="q" placeholder="Search teams and players…" autofocus>
  <button type="submit">Search</button>
</form>
{% if games %}
<h2>Recent Games</h2>
<table>
  <thead>
    <tr><th>Date</th><th>Home</th><th>Away</th><th>Score</th></tr>
  </thead>
  <tbody>
    {% for g in games %}
    <tr>
      <td><a href="/game/{{ g.game_id }}">{{ g.date }}</a></td>
      <td><a href="/team/{{ g.home_id }}">{{ g.home_title }}</a></td>
      <td><a href="/team/{{ g.away_id }}">{{ g.away_title }}</a></td>
      <td>{{ g.home_score }}–{{ g.away_score }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
