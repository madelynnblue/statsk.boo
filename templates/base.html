<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}statsk.boo{% endblock %} — WFTDA StatsBook Browser</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --fg: #222; --border: #ddd; --th-bg: #f5f5f5; --tr-even: #fafafa;
      --accent: #c00; --link: #0066cc; --muted: #666; --card-bg: #f5f5f5;
      --input-border: #ccc; --sticky-bg: #fff; --hl: #f0f4ff; --hl-head: #e0e8f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d; --fg: #e8e8e8; --border: #222; --th-bg: #141414; --tr-even: #111;
        --accent: #ff2d78; --link: #4db8c8; --muted: #666; --card-bg: #131313;
        --input-border: #2a2a2a; --sticky-bg: #0d0d0d; --hl: #051015; --hl-head: #030c10;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 1rem; color: var(--fg); background: var(--bg); }
    header { border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    header a { text-decoration: none; color: var(--accent); font-weight: bold; font-size: 1.2rem; }
    .search-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .search-row input { flex: 1; padding: 0.5rem; font-size: 1rem; border: 1px solid var(--input-border); border-radius: 3px; background: var(--bg); color: var(--fg); }
    .search-row button { padding: 0.5rem 1.2rem; background: var(--accent); color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
    th { background: var(--th-bg); }
    tr:nth-child(even) { background: var(--tr-even); }
    a { color: var(--link); }
    h1 { margin-top: 0; }
    h2 { color: var(--accent); }
    .stat { font-size: 1.5rem; font-weight: bold; }
    .stat-label { font-size: 0.85rem; color: var(--muted); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .stat-card { background: var(--card-bg); padding: 0.75rem 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <a href="/">statsk.boo — WFTDA StatsBook Browser</a>
    <nav style="display:inline; margin-left:1rem;">
      <a href="/leagues" style="font-size:0.9rem; color:var(--muted); text-decoration:none; margin-right:0.75rem;">Leagues</a>
      <a href="/about" style="font-size:0.9rem; color:var(--muted); text-decoration:none;">About</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
