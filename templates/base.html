<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WSB{% endblock %} — WFTDA Stats Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 1rem; color: #222; }
    header { border-bottom: 2px solid #c00; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    header a { text-decoration: none; color: #c00; font-weight: bold; font-size: 1.2rem; }
    .search-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .search-row input { flex: 1; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 3px; }
    .search-row button { padding: 0.5rem 1.2rem; background: #c00; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 1rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #f5f5f5; }
    tr:nth-child(even) { background: #fafafa; }
    a { color: #0066cc; }
    h1 { margin-top: 0; }
    h2 { color: #c00; }
    .stat { font-size: 1.5rem; font-weight: bold; }
    .stat-label { font-size: 0.85rem; color: #666; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .stat-card { background: #f5f5f5; padding: 0.75rem 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <header><a href="/">WSB — WFTDA Stats Browser</a></header>
  <form class="search-row" action="/search" method="get">
    <input type="search" name="q" placeholder="Search players or teams…" value="{{ query|default('') }}">
    <button type="submit">Search</button>
  </form>
  {% block content %}{% endblock %}
</body>
</html>
